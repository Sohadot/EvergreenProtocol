<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Evergreen Protocol — reference integrity and institutional continuity</title>
  <desc id="desc">Institutional sharing card, with forest-green typography panel, a restrained gold divider, and a geometric reference-continuity symbol.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16271f"/>
      <stop offset=".57" stop-color="#10231e"/>
      <stop offset="1" stop-color="#0b1918"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#31776e" stop-opacity=".35"/>
      <stop offset="1" stop-color="#31776e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bdd4be" stop-opacity=".75"/>
      <stop offset=".52" stop-color="#5e9a8f" stop-opacity=".35"/>
      <stop offset="1" stop-color="#d5ad64" stop-opacity=".85"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#a5c5b2" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <clipPath id="artwork"><rect x="708" y="24" width="458" height="566"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="29" y="29" width="1142" height="572" rx="2" fill="none" stroke="#b0c4b3" stroke-opacity=".25"/>
  <path d="M59 29H171M1028 601h113" stroke="#c7a05e" stroke-width="3"/>

  <g font-family="DejaVu Sans, sans-serif" fill="#c6d7c9" font-size="15" font-weight="bold" letter-spacing="3">
    <text x="85" y="107">CATEGORY STANDARD</text>
    <text x="428" y="107" fill="#c8a769" letter-spacing="1.8">/  V1.0</text>
  </g>
  <rect x="85" y="130" width="72" height="3" fill="#c5a064"/>

  <g fill="#f1f4ea" font-family="Bitstream Charter, Georgia, serif" font-weight="bold">
    <text x="80" y="257" font-size="91" letter-spacing="-2">Evergreen</text>
    <text x="80" y="354" font-size="91" letter-spacing="-2">Protocol</text>
  </g>
  <path d="M85 398H548" stroke="#c0d0bf" stroke-opacity=".28"/>
  <rect x="85" y="397" width="104" height="2" fill="#c5a064"/>
  <g font-family="DejaVu Sans, sans-serif" font-size="27" fill="#c6d8c9">
    <text x="83" y="452">Reference integrity.</text>
    <text x="83" y="491">Institutional continuity.</text>
  </g>

  <g clip-path="url(#artwork)">
    <circle cx="929" cy="312" r="323" fill="url(#glow)"/>
    <circle cx="937" cy="309" r="239" fill="none" stroke="url(#ring)" stroke-width="1" opacity=".38"/>
    <circle cx="937" cy="309" r="190" fill="none" stroke="#89b4a6" stroke-width="1" opacity=".35"/>
    <circle cx="937" cy="309" r="140" fill="none" stroke="url(#ring)" stroke-width="2" opacity=".75"/>
    <circle cx="937" cy="309" r="89" fill="none" stroke="#adcbc0" stroke-opacity=".45"/>
    <path d="M937 69V549M697 309h480" stroke="#a5c6bb" stroke-opacity=".2" stroke-width="1"/>
    <path d="M770 142l334 334m0-334L770 476" stroke="#a5c6bb" stroke-opacity=".1" stroke-width="1"/>

    <!-- Four governed properties as linked anchors, not a claim of certification. -->
    <path d="M937 169L1077 309 937 449 797 309Z" fill="#25473e" fill-opacity=".2" stroke="#c4aa77" stroke-opacity=".58" stroke-width="1.6"/>
    <path d="M937 220L1026 309 937 398 848 309Z" fill="#244b43" fill-opacity=".42" stroke="#9ec0ad" stroke-opacity=".6"/>
    <path d="M937 169V220M1077 309h-51M937 449v-51M797 309h51" stroke="#d6b779" stroke-width="2"/>
    <circle cx="937" cy="169" r="8" fill="#d4b373"/>
    <circle cx="1077" cy="309" r="8" fill="#d4b373"/>
    <circle cx="937" cy="449" r="8" fill="#d4b373"/>
    <circle cx="797" cy="309" r="8" fill="#d4b373"/>
    <circle cx="937" cy="309" r="43" fill="#142b25" stroke="#e6d0a0" stroke-width="2"/>
    <path d="M937 309c-9-11-17-17-26-17-10 0-17 8-17 17s7 17 17 17c9 0 17-6 26-17 9-11 17-17 26-17 10 0 17 8 17 17s-7 17-17 17c-9 0-17-6-26-17Z" fill="none" stroke="#e9d7ad" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/>
    <circle cx="937" cy="309" r="61" fill="none" stroke="#d3bb82" stroke-opacity=".52" stroke-dasharray="2 13" stroke-linecap="round" stroke-width="3"/>
    <path d="M937 61a248 248 0 0 1 248 248" fill="none" stroke="#ba9a60" stroke-width="3" stroke-opacity=".7"/>
    <path d="M937 557a248 248 0 0 1-248-248" fill="none" stroke="#92b5a7" stroke-width="3" stroke-opacity=".45"/>
  </g>

  <path d="M85 552H1117" stroke="#8db2a4" stroke-opacity=".25"/>
  <g font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="bold" letter-spacing="2" fill="#d3ddcd">
    <text x="85" y="581">EVERGREENPROTOCOL.COM</text>
    <text x="1115" y="581" text-anchor="end" fill="#bea878">AI-ERA DIGITAL CONTINUITY</text>
  </g>
</svg>
